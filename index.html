<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BawełnaApp - Symulator Farmy</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #1e272e; color: #f5f6fa; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    /* Górny pasek HUD */
    #hud {
      background: #2f3640; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 2px solid #353b48; z-index: 10;
    }
    .hud-group { display: flex; gap: 20px; align-items: center; }
    .stat-box { background: #1e272e; padding: 8px 14px; border-radius: 8px; border: 1px solid #485460; font-weight: bold; }
    .money { color: #4cd137; font-size: 1.1rem; }
    .clock { color: #fbc531; font-size: 1.1rem; }
    .status-badge { padding: 4px 10px; border-radius: 12px; font-size: 0.85rem; background: #485460; }
    .status-work { background: #44bd32; color: #fff; }

    /* Przyciski akcji */
    button {
      background: #0097e6; color: white; border: none; padding: 9px 14px; border-radius: 6px;
      cursor: pointer; font-weight: 600; transition: 0.15s;
    }
    button:hover:not(:disabled) { background: #00a8ff; transform: translateY(-1px); }
    button:disabled { background: #57606f; cursor: not-allowed; opacity: 0.7; }
    button.btn-boost { background: #e84118; }
    button.btn-boost:hover:not(:disabled) { background: #ff5252; }
    button.btn-build { background: #8c7ae6; }
    button.btn-build.active { background: #fbc531; color: #1e272e; }

    /* Główny obszar gry */
    #main-area { display: flex; flex: 1; position: relative; }
    canvas { flex: 1; display: block; cursor: crosshair; background: #6ab04c; }

    /* Prawy panel boczny (Chata / Sklep) */
    #sidebar {
      width: 340px; background: #2f3640; border-left: 2px solid #353b48; padding: 20px;
      display: flex; flex-direction: column; gap: 16px; overflow-y: auto;
    }
    .panel-card { background: #1e272e; padding: 15px; border-radius: 10px; border: 1px solid #485460; }
    .panel-card h3 { margin-bottom: 10px; color: #fbc531; border-bottom: 1px solid #353b48; padding-bottom: 6px; }
    .panel-row { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; font-size: 0.92rem; }
    .worker-list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; max-height: 150px; overflow-y: auto; }
    .worker-item { background: #2f3640; padding: 6px 10px; border-radius: 6px; font-size: 0.85rem; display: flex; justify-content: space-between; }
    .hint { font-size: 0.82rem; color: #dcdde1; line-height: 1.4; }
  </style>
</head>
<body>

  <!-- GÓRNY PASEK -->
  <div id="hud">
    <div class="hud-group">
      <div class="stat-box money">💰 <span id="ui-money">250</span> $</div>
      <div class="stat-box clock">🕒 <span id="ui-time">09:30</span> <span id="ui-shift" class="status-badge">Odpoczynek (Praca od 11:00)</span></div>
    </div>
    <div class="hud-group">
      <button id="btn-build-hut" class="btn-build">🏠 Zbuduj Chatę (150 $)</button>
      <button id="btn-boost" class="btn-boost">⚡ BOOST (Gotowy)</button>
      <button id="btn-shop">🛒 Sklep Ulepszeń</button>
    </div>
  </div>

  <!-- OBSZAR GRY + PANEL -->
  <div id="main-area">
    <canvas id="gameCanvas"></canvas>

    <div id="sidebar">
      <div class="panel-card">
        <h3>ℹ️ Instrukcja</h3>
        <p class="hint">
          • O godzinie <b>11:00</b> rolnicy wychodzą z chat na pole.<br>
          • Kliknij <b>Chatę</b> na mapie, aby zatrudnić lub ulepszyć pracowników.<br>
          • Kliknij <b>Zbuduj Chatę</b>, a następnie wskaż wolne miejsce na trawie.
        </p>
      </div>

      <!-- DYNAMICZNY INTERFEJS CHATY LUB SKLEPU -->
      <div id="dynamic-panel"></div>
    </div>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- KONFIGURACJA ŚWIATA I SIATKI PATHFINDINGU ---
const TILE_SIZE = 32;
let COLS = 30;
let ROWS = 22;

const state = {
  money: 250,
  gameMinutes: 9 * 60 + 30, // Start o 09:30
  timeSpeed: 2.2, // Ile minut gry mija na sekundę rzeczywistą
  buildMode: false,
  selectedHutId: null,
  activeTab: 'hut', // 'hut' lub 'shop'
  boost: {
    active: false,
    timer: 0,
    cooldownTimer: 0,
    duration: 8,        // sekundy działania
    cooldown: 20,       // sekundy odnowienia
    multiplier: 1.8,    // mnożnik prędkości
    lvlDuration: 1,
    lvlPower: 1,
    lvlCooldown: 1
  }
};

// Typy pracowników odblokowywane przez poziom chaty
const WORKER_TIERS = [
  { tier: 1, name: "Uczeń", cost: 50, speed: 75, capacity: 1, valueMult: 1.0, color: "#3498db" },
  { tier: 2, name: "Rolnik", cost: 140, speed: 105, capacity: 2, valueMult: 1.5, color: "#e67e22" },
  { tier: 3, name: "Mistrz Zbiorów", cost: 320, speed: 145, capacity: 4, valueMult: 2.2, color: "#9b59b6" }
];

const depot = { gx: 3, gy: 10, gw: 3, gh: 3 }; // Punkt skupu
const fieldArea = { gx: 13, gy: 2, gw: 15, gh: 18 }; // Obszar pola bawełny

let huts = [];
let cottonPlants = [];
let workers = [];
let floatingTexts = [];
let walkGrid = []; // 0 = wolne, 1 = przeszkoda

// --- INICJALIZACJA MAPY ---
function resizeCanvas() {
  canvas.width = canvas.parentElement.clientWidth - 340;
  canvas.height = canvas.parentElement.clientHeight;
  COLS = Math.floor(canvas.width / TILE_SIZE);
  ROWS = Math.floor(canvas.height / TILE_SIZE);
  fieldArea.gw = Math.max(8, COLS - 15);
  fieldArea.gh = Math.max(8, ROWS - 4);
  rebuildWalkGrid();
}
window.addEventListener('resize', resizeCanvas);

function rebuildWalkGrid() {
  walkGrid = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
  // Oznacz skup jako przeszkodę
  for (let y = depot.gy; y < depot.gy + depot.gh; y++) {
    for (let x = depot.gx; x < depot.gx + depot.gw; x++) {
      if (walkGrid[y] && walkGrid[y][x] !== undefined) walkGrid[y][x] = 1;
    }
  }
  // Oznacz chaty jako przeszkody
  huts.forEach(h => {
    for (let y = h.gy; y < h.gy + 2; y++) {
      for (let x = h.gx; x < h.gx + 2; x++) {
        if (walkGrid[y] && walkGrid[y][x] !== undefined) walkGrid[y][x] = 1;
      }
    }
  });
}

// Generowanie obfitego pola bawełny z losowym przesunięciem
function generateCottonField() {
  cottonPlants = [];
  for (let gy = fieldArea.gy; gy < fieldArea.gy + fieldArea.gh; gy++) {
    for (let gx = fieldArea.gx; gx < fieldArea.gx + fieldArea.gw; gx++) {
      if (Math.random() < 0.78) { // Gęste obsadzenie
        cottonPlants.push({
          id: Math.random(),
          gx, gy,
          x: gx * TILE_SIZE + TILE_SIZE / 2 + (Math.random() * 14 - 7),
          y: gy * TILE_SIZE + TILE_SIZE / 2 + (Math.random() * 14 - 7),
          grown: true,
          regrowTimer: 0,
          reservedBy: null
        });
      }
    }
  }
}

// --- ALGORYTM A* (PATHFINDING) ---
function findNearestWalkable(gx, gy) {
  if (walkGrid[gy] && walkGrid[gy][gx] === 0) return { gx, gy };
  for (let r = 1; r < 6; r++) {
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        const nx = gx + dx, ny = gy + dy;
        if (ny >= 0 && ny < ROWS && nx >= 0 && nx < COLS && walkGrid[ny][nx] === 0) {
          return { gx: nx, gy: ny };
        }
      }
    }
  }
  return { gx: 0, gy: 0 };
}

function findPathAStar(startX, startY, targetX, targetY) {
  const start = findNearestWalkable(Math.floor(startX / TILE_SIZE), Math.floor(startY / TILE_SIZE));
  const goal = findNearestWalkable(Math.floor(targetX / TILE_SIZE), Math.floor(targetY / TILE_SIZE));

  const openSet = [{ x: start.gx, y: start.gy, g: 0, f: 0, parent: null }];
  const closedSet = new Set();

  while (openSet.length > 0) {
    openSet.sort((a, b) => a.f - b.f);
    const current = openSet.shift();
    const key = `${current.x},${current.y}`;

    if (current.x === goal.gx && current.y === goal.gy) {
      const path = [];
      let curr = current;
      while (curr.parent) {
        path.unshift({ x: curr.x * TILE_SIZE + TILE_SIZE / 2, y: curr.y * TILE_SIZE + TILE_SIZE / 2 });
        curr = curr.parent;
      }
      return path;
    }

    closedSet.add(key);

    const neighbors = [
      { x: current.x + 1, y: current.y }, { x: current.x - 1, y: current.y },
      { x: current.x, y: current.y + 1 }, { x: current.x, y: current.y - 1 }
    ];

    for (const n of neighbors) {
      if (n.x < 0 || n.x >= COLS || n.y < 0 || n.y >= ROWS) continue;
      if (walkGrid[n.y][n.x] === 1) continue;
      if (closedSet.has(`${n.x},${n.y}`)) continue;

      const g = current.g + 1;
      const h = Math.abs(n.x - goal.gx) + Math.abs(n.y - goal.gy);
      const existing = openSet.find(o => o.x === n.x && o.y === n.y);

      if (!existing) {
        openSet.push({ x: n.x, y: n.y, g, f: g + h, parent: current });
      } else if (g < existing.g) {
        existing.g = g;
        existing.f = g + h;
        existing.parent = current;
      }
    }
  }
  return [];
}

// --- ZARZĄDZANIE CHATAMI I PRACOWNIKAMI ---
function createHut(gx, gy) {
  const id = Date.now() + Math.random();
  const hut = {
    id, gx, gy,
    level: 1,
    capacity: 2,
    workers: []
  };
  huts.push(hut);
  rebuildWalkGrid();
  state.selectedHutId = id;
  state.activeTab = 'hut';
  renderSidebar();
}

function hireWorker(hutId, tierIndex) {
  const hut = huts.find(h => h.id === hutId);
  const spec = WORKER_TIERS[tierIndex];
  if (!hut || hut.workers.length >= hut.capacity || state.money < spec.cost) return;

  state.money -= spec.cost;
  const worker = {
    id: Math.random(),
    hutId: hut.id,
    tier: spec.tier,
    name: spec.name,
    speed: spec.speed,
    maxCarry: spec.capacity,
    valueMult: spec.valueMult,
    color: spec.color,
    x: (hut.gx + 1) * TILE_SIZE,
    y: (hut.gy + 2) * TILE_SIZE + 8,
    insideHut: true,
state: 'IDLE', // IDLE, TO_COTTON, HARVESTING, TO_DEPOT, TO_HUT
path: [],
targetPlant: null,
carrying: 0,
actionTimer: 0
};
hut.workers.push(worker);
workers.push(worker);
renderSidebar();
}
function upgradeHutCapacity(hutId) {
const hut = huts.find(h => h.id === hutId);
const cost = hut.capacity * 90;
if (!hut || state.money < cost) return;
state.money -= cost;
hut.capacity += 2;
renderSidebar();
}
function upgradeHutLevel(hutId) {
const hut = huts.find(h => h.id === hutId);
const cost = hut.level * 220;
if (!hut || hut.level >= 3 || state.money < cost) return;
state.money -= cost;
hut.level += 1;
renderSidebar();
}
// --- LOGIKA AI PRACOWNIKÓW ---
function isWorkTime() {
const hour = Math.floor(state.gameMinutes / 60);
return hour >= 11 && hour < 20; // Praca od 11:00 do 20:00
}
function updateWorkers(dt) {
const working = isWorkTime();
const boostMult = state.boost.active ? state.boost.multiplier : 1.0;
workers.forEach(w => {
const hut = huts.find(h => h.id === w.hutId);
if (!hut) return;
// 1. Gdy wybija 11:00 -> wyjdź z chaty
if (working && w.insideHut) {
w.insideHut = false;
w.x = (hut.gx + 1) * TILE_SIZE;
w.y = (hut.gy + 2) * TILE_SIZE + 10;
w.state = 'IDLE';
}
// 2. Gdy kończy się zmiana -> wróć do chaty
if (!working && !w.insideHut && w.state !== 'TO_HUT') {
if (w.targetPlant) { w.targetPlant.reservedBy = null; w.targetPlant = null; }
w.state = 'TO_HUT';
w.path = findPathAStar(w.x, w.y, (hut.gx + 1) * TILE_SIZE, (hut.gy + 2) * TILE_SIZE + 10);
}
if (w.insideHut) return;
// 3. Wybór losowej dojrzałej rośliny bawełny
if (w.state === 'IDLE') {
if (w.carrying >= w.maxCarry) {
w.state = 'TO_DEPOT';
w.path = findPathAStar(w.x, w.y, (depot.gx + 3) * TILE_SIZE + 10, (depot.gy + 1) * TILE_SIZE);
return;
}
const available = cottonPlants.filter(p => p.grown && !p.reservedBy);
if (available.length > 0) {
const chosen = available[Math.floor(Math.random() * available.length)];
chosen.reservedBy = w.id;
w.targetPlant = chosen;
w.state = 'TO_COTTON';
w.path = findPathAStar(w.x, w.y, chosen.x, chosen.y);
}
}
// 4. Poruszanie się po ścieżce A*
if (w.path.length > 0) {
const target = w.path[0];
const dx = target.x - w.x;
const dy = target.y - w.y;
const dist = Math.hypot(dx, dy);
const moveStep = w.speed * boostMult * dt;
if (dist <= moveStep) {
w.x = target.x;
w.y = target.y;
w.path.shift();
} else {
w.x += (dx / dist) * moveStep;
w.y += (dy / dist) * moveStep;
}
} else {
// Dotarcie do celu
if (w.state === 'TO_COTTON') {
w.state = 'HARVESTING';
w.actionTimer = 0.7 / boostMult;
} else if (w.state === 'HARVESTING') {
w.actionTimer -= dt;
if (w.actionTimer <= 0) {
if (w.targetPlant) {
w.targetPlant.grown = false;
w.targetPlant.regrowTimer = 14;
w.targetPlant.reservedBy = null;
w.targetPlant = null;
}
w.carrying += 1;
w.state = 'IDLE';
}
} else if (w.state === 'TO_DEPOT') {
const earned = Math.round(w.carrying * 15 * w.valueMult);
state.money += earned;
floatingTexts.push({ x: w.x, y: w.y - 12, text: `+${earned}$`, alpha: 1 });
w.carrying = 0;
w.state = 'IDLE';
} else if (w.state === 'TO_HUT') {
w.insideHut = true;
w.carrying = 0;
}
}
});
}
// --- AKTUALIZACJA CZASU, ROŚLIN I BOOSTA ---
function update(dt) {
// Zegar (24h = 1440 min)
state.gameMinutes = (state.gameMinutes + state.timeSpeed * dt) % 1440;
// Odrastanie bawełny
cottonPlants.forEach(p => {
if (!p.grown) {
p.regrowTimer -= dt;
if (p.regrowTimer <= 0) p.grown = true;
}
});
// Boost
if (state.boost.active) {
state.boost.timer -= dt;
if (state.boost.timer <= 0) {
state.boost.active = false;
state.boost.cooldownTimer = state.boost.cooldown;
}
} else if (state.boost.cooldownTimer > 0) {
state.boost.cooldownTimer = Math.max(0, state.boost.cooldownTimer - dt);
}
// Unoszące się napisy z zarobkiem
floatingTexts.forEach(ft => { ft.y -= 25 * dt; ft.alpha -= 0.9 * dt; });
floatingTexts = floatingTexts.filter(ft => ft.alpha > 0);
updateWorkers(dt);
updateHUD();
}
// --- RENDEROWANIE ---
function draw() {
ctx.clearRect(0, 0, canvas.width, canvas.height);
// Tło pola uprawnego
ctx.fillStyle = "#58943c";
ctx.fillRect(fieldArea.gx * TILE_SIZE, fieldArea.gy * TILE_SIZE, fieldArea.gw * TILE_SIZE, fieldArea.gh * TILE_SIZE);
ctx.strokeStyle = "#487eb0";
ctx.lineWidth = 2;
ctx.strokeRect(fieldArea.gx * TILE_SIZE, fieldArea.gy * TILE_SIZE, fieldArea.gw * TILE_SIZE, fieldArea.gh * TILE_SIZE);
// Punkt skupu
ctx.fillStyle = "#d35400";
ctx.fillRect(depot.gx * TILE_SIZE, depot.gy * TILE_SIZE, depot.gw * TILE_SIZE, depot.gh * TILE_SIZE);
ctx.strokeStyle = "#f39c12";
ctx.strokeRect(depot.gx * TILE_SIZE, depot.gy * TILE_SIZE, depot.gw * TILE_SIZE, depot.gh * TILE_SIZE);
ctx.fillStyle = "#fff";
ctx.font = "bold 12px sans-serif";
ctx.textAlign = "center";
ctx.fillText("SKUP", (depot.gx + 1.5) * TILE_SIZE, (depot.gy + 1.6) * TILE_SIZE);
// Rośliny bawełny
cottonPlants.forEach(p => {
// Krzaczek
ctx.fillStyle = "#27ae60";
ctx.beginPath();
ctx.arc(p.x, p.y, 7, 0, Math.PI * 2);
ctx.fill();
// Puszysta biała bawełna
if (p.grown) {
ctx.fillStyle = "#ffffff";
ctx.beginPath();
ctx.arc(p.x - 3, p.y - 2, 4, 0, Math.PI * 2);
ctx.arc(p.x + 3, p.y - 1, 4, 0, Math.PI * 2);
ctx.arc(p.x, p.y + 3, 4, 0, Math.PI * 2);
ctx.fill();
}
});
// Chaty rolników
huts.forEach(h => {
const px = h.gx * TILE_SIZE;
const py = h.gy * TILE_SIZE;
const size = TILE_SIZE * 2;
ctx.fillStyle = h.id === state.selectedHutId ? "#fbc531" : "#8c7ae6";
ctx.fillRect(px, py, size, size);
ctx.strokeStyle = "#2f3640";
ctx.lineWidth = 2;
ctx.strokeRect(px, py, size, size);
ctx.fillStyle = "#1e272e";
ctx.font = "bold 11px sans-serif";
ctx.textAlign = "center";
ctx.fillText(`Chata Lv.${h.level}`, px + size / 2, py + 24);
ctx.fillText(`${h.workers.length}/${h.capacity} os.`, px + size / 2, py + 42);
});
// Pracownicy
workers.forEach(w => {
if (w.insideHut) return;
// Aura boosta
if (state.boost.active) {
ctx.strokeStyle = "#ff5252";
ctx.lineWidth = 2;
ctx.beginPath();
ctx.arc(w.x, w.y, 12, 0, Math.PI * 2);
ctx.stroke();
}
ctx.fillStyle = w.color;
ctx.beginPath();
ctx.arc(w.x, w.y, 8, 0, Math.PI * 2);
ctx.fill();
ctx.strokeStyle = "#fff";
ctx.lineWidth = 1.5;
ctx.stroke();
// Koszyk z bawełną nad głową
if (w.carrying > 0) {
ctx.fillStyle = "#fff";
ctx.beginPath();
ctx.arc(w.x, w.y - 10, 4 + w.carrying, 0, Math.PI * 2);
ctx.fill();
}
});
// Efekty zarobku
floatingTexts.forEach(ft => {
ctx.fillStyle = `rgba(255, 255, 255, ${ft.alpha})`;
ctx.font = "bold 14px sans-serif";
ctx.fillText(ft.text, ft.x, ft.y);
});
}
// --- INTERFEJS UŻYTKOWNIKA (HUD + PANEL BOCZNY) ---
function updateHUD() {
document.getElementById('ui-money').textContent = state.money;
const hrs = String(Math.floor(state.gameMinutes / 60)).padStart(2, '0');
const mins = String(Math.floor(state.gameMinutes % 60)).padStart(2, '0');
document.getElementById('ui-time').textContent = `${hrs}:${mins}`;
const shiftBadge = document.getElementById('ui-shift');
if (isWorkTime()) {
shiftBadge.textContent = "ZBIORY W TOKU (do 20:00)";
shiftBadge.className = "status-badge status-work";
} else {
shiftBadge.textContent = "Odpoczynek (Start 11:00)";
shiftBadge.className = "status-badge";
}
const btnBoost = document.getElementById('btn-boost');
if (state.boost.active) {
btnBoost.textContent = `⚡ BOOST AKTYWNY (${state.boost.timer.toFixed(1)}s)`;
btnBoost.disabled = true;
} else if (state.boost.cooldownTimer > 0) {
btnBoost.textContent = `⏳ Odnowienie (${Math.ceil(state.boost.cooldownTimer)}s)`;
btnBoost.disabled = true;
} else {
btnBoost.textContent = `⚡ BOOST (x${state.boost.multiplier.toFixed(1)})`;
btnBoost.disabled = false;
}
const btnBuild = document.getElementById('btn-build-hut');
btnBuild.disabled = state.money < 150;
btnBuild.classList.toggle('active', state.buildMode);
}
function renderSidebar() {
const container = document.getElementById('dynamic-panel');
if (state.activeTab === 'shop') {
const costDur = state.boost.lvlDuration * 120;
const costPow = state.boost.lvlPower * 160;
const costCd = state.boost.lvlCooldown * 140;
container.innerHTML = `<div class="panel-card"> <h3>🛒 Sklep: Ulepszenia Boosta</h3> <div class="panel-row"> <span>Czas trwania (${state.boost.duration}s)</span> <button onclick="buyBoostUpgrade('duration', ${costDur})" ${state.money < costDur ? 'disabled' : ''}>+2s (${costDur}$)</button> </div> <div class="panel-row"> <span>Moc przyspieszenia (x${state.boost.multiplier.toFixed(1)})</span> <button onclick="buyBoostUpgrade('power', ${costPow})" ${state.money < costPow ? 'disabled' : ''}>+0.3x (${costPow}$)</button> </div> <div class="panel-row"> <span>Czas odnowienia (${state.boost.cooldown}s)</span> <button onclick="buyBoostUpgrade('cooldown', ${costCd})" ${state.money < costCd || state.boost.cooldown <= 6 ? 'disabled' : ''}>-2s (${costCd}$)</button> </div> </div>`;
return;
}
const hut = huts.find(h => h.id === state.selectedHutId);
if (!hut) {
container.innerHTML = `<div class="panel-card"><p class="hint">Kliknij dowolną chatę na mapie, aby zarządzać pracownikami.</p></div>`;
return;
}
const capCost = hut.capacity * 90;
const lvlCost = hut.level * 220;
let hireButtonsHTML = '';
WORKER_TIERS.forEach((tier, idx) => {
const unlocked = hut.level >= tier.tier;
const canHire = unlocked && hut.workers.length < hut.capacity && state.money >= tier.cost;
hireButtonsHTML += `<div class="panel-row"> <span>${unlocked ? tier.name : '🔒 Wymaga Lv.' + tier.tier}</span> <button onclick="hireWorker(${hut.id}, ${idx})" ${!canHire ? 'disabled' : ''}>Zatrudnij (${tier.cost}$)</button> </div>`;
});
const workersListHTML = hut.workers.map(w =>
`<div class="worker-item"><span>${w.name}</span><span>Kosz: ${w.carrying}/${w.maxCarry}</span></div>`
).join('');
container.innerHTML = `<div class="panel-card"> <h3>🏠 Chata Rolników (Poziom ${hut.level}/3)</h3> <div class="panel-row"> <span>Pojemność: <b>${hut.workers.length} / ${hut.capacity}</b></span> <button onclick="upgradeHutCapacity(${hut.id})" ${state.money < capCost ? 'disabled' : ''}>+2 miejsca (${capCost}$)</button> </div> <div class="panel-row"> <span>Poziom chaty: <b>Lv.${hut.level}</b></span> <button onclick="upgradeHutLevel(${hut.id})" ${hut.level >= 3 || state.money < lvlCost ? 'disabled' : ''}> ${hut.level >= 3 ? 'MAX' :`Awans (${lvlCost}$)`} </button> </div> <hr style="border-color:#353b48; margin:10px 0;"> <b>Zatrudnij pracownika:</b> ${hireButtonsHTML} <div class="worker-list">${workersListHTML || '<span class="hint">Brak pracowników w chacie</span>'}</div> </div> `;
}
window.buyBoostUpgrade = function(type, cost) {
if (state.money < cost) return;
state.money -= cost;
if (type === 'duration') { state.boost.duration += 2; state.boost.lvlDuration++; }
if (type === 'power') { state.boost.multiplier += 0.3; state.boost.lvlPower++; }
if (type === 'cooldown') { state.boost.cooldown = Math.max(6, state.boost.cooldown - 2); state.boost.lvlCooldown++; }
renderSidebar();
};
// --- ZDARZENIA KLIKNIĘĆ ---
document.getElementById('btn-build-hut').addEventListener('click', () => {
state.buildMode = !state.buildMode;
});
document.getElementById('btn-boost').addEventListener('click', () => {
if (!state.boost.active && state.boost.cooldownTimer <= 0) {
state.boost.active = true;
state.boost.timer = state.boost.duration;
}
});
document.getElementById('btn-shop').addEventListener('click', () => {
state.activeTab = state.activeTab === 'shop' ? 'hut' : 'shop';
renderSidebar();
});
canvas.addEventListener('click', (e) => {
const rect = canvas.getBoundingClientRect();
const mx = e.clientX - rect.left;
const my = e.clientY - rect.top;
const gx = Math.floor(mx / TILE_SIZE);
const gy = Math.floor(my / TILE_SIZE);
// Tryb budowania nowej chaty
if (state.buildMode) {
if (state.money < 150) return;
// Sprawdź czy teren jest wolny i poza polem bawełny
const onField = gx >= fieldArea.gx - 1 && gx <= fieldArea.gx + fieldArea.gw;
const blocked = walkGrid[gy]?.[gx] === 1 || walkGrid[gy + 1]?.[gx] === 1 ||
walkGrid[gy]?.[gx + 1] === 1 || walkGrid[gy + 1]?.[gx + 1] === 1;
if (!onField && !blocked && gy < ROWS - 2 && gx < COLS - 2) {
state.money -= 150;
createHut(gx, gy);
state.buildMode = false;
}
return;
}
// Wybór istniejącej chaty
const clickedHut = huts.find(h => gx >= h.gx && gx < h.gx + 2 && gy >= h.gy && gy < h.gy + 2);
if (clickedHut) {
state.selectedHutId = clickedHut.id;
state.activeTab = 'hut';
renderSidebar();
}
});
// --- START GRY ---
resizeCanvas();
generateCottonField();
createHut(3, 4); // Startowa chata
state.money = 150; // Startowa gotówka na pierwszych pracowników
renderSidebar();
let lastTime = performance.now();
function loop(now) {
const dt = Math.min(0.1, (now - lastTime) / 1000);
lastTime = now;
update(dt);
draw();
requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
